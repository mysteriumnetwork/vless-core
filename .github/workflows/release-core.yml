name: Release Xray core

# Builds XRay.xcframework and XRay.aar and publishes both as release assets,
# so one tag pins Apple and Android to the same Xray-core build.
#
# The framework is ~60 MB zipped and is rebuilt on every Xray-core bump, so it
# is deliberately not committed. Package.swift consumes it as a remote
# binaryTarget: a consumer cloning this repo downloads a verified archive rather
# than needing Go, gomobile and a local build.
#
# After a run, update the url and checksum in
# Package.swift — both are printed in the job summary.

on:
  push:
    tags: ["xray-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. xray-v26.3.27"
        required: true

permissions:
  contents: write

jobs:
  build-apple:
    # macOS because `gomobile bind -target=ios` needs the iphoneos and
    # iphonesimulator SDKs, which only ship with Xcode.
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Initialise gomobile
        run: gomobile init

      - name: Build the framework
        run: ./scripts/build_xray_apple.sh

      - name: Package and checksum
        id: package
        working-directory: Artifacts
        run: |
          zip -qry XRay.xcframework.zip XRay.xcframework
          checksum="$(swift package compute-checksum XRay.xcframework.zip)"
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h XRay.xcframework.zip | cut -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: xcframework
          path: Artifacts/XRay.xcframework.zip
          retention-days: 1

      - name: Record checksum
        run: |
          echo "${{ steps.package.outputs.checksum }}" > checksum.txt
          echo "${{ steps.package.outputs.size }}" > size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: apple-meta
          path: |
            checksum.txt
            size.txt
          retention-days: 1

  build-android:
    # Linux, not macOS: gomobile bind -target=android needs only the NDK, and
    # the Linux images ship one.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/xray-mobile/go.mod
          cache-dependency-path: third_party/xray-mobile/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install the pinned NDK
        run: |
          # By exact revision, via the SDK manager already on the image: it is
          # the same revision the consuming app pins, and a different NDK links
          # a different libc++. Named release channels (r28c and friends) are
          # resolved by third parties and have arrived incomplete.
          version="$(grep -oE 'NDK_VERSION:-[0-9.]+' scripts/build_xray_android.sh | cut -d- -f2-)"
          echo "installing ndk;$version"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$version" >/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$version" >> "$GITHUB_ENV"

      - name: Initialise gomobile
        run: gomobile init

      - name: Build the aar
        run: ./scripts/build_xray_android.sh

      - uses: actions/upload-artifact@v4
        with:
          name: aar
          path: Artifacts/XRay.aar
          retention-days: 1

  publish:
    needs: [build-apple, build-android]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets

      - name: Resolve tag
        id: tag
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="${GITHUB_REF_NAME}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Read the Apple checksum
        id: apple
        run: |
          echo "checksum=$(cat assets/apple-meta/checksum.txt)" >> "$GITHUB_OUTPUT"
          echo "size=$(cat assets/apple-meta/size.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Both assets go up together: a release carrying only one of them
          # would let the platforms drift onto different cores.
          gh release create "${{ steps.tag.outputs.tag }}" \
            assets/xcframework/XRay.xcframework.zip \
            assets/aar/XRay.aar \
            --title "${{ steps.tag.outputs.tag }}" \
            --notes "Trimmed Xray-core built from third_party/xray-mobile.

          \`XRay.xcframework.zip\` SHA-256: \`${{ steps.apple.outputs.checksum }}\`" \
            || gh release upload "${{ steps.tag.outputs.tag }}" \
                 assets/xcframework/XRay.xcframework.zip \
                 assets/aar/XRay.aar --clobber

      - name: Summary
        run: |
          base="https://github.com/${{ github.repository }}/releases/download/${{ steps.tag.outputs.tag }}"
          {
            echo "### Xray core published"
            echo
            echo "Apple: ${{ steps.apple.outputs.size }}"
            echo
            echo "Update \`Package.swift\`:"
            echo
            echo '```swift'
            echo '.binaryTarget('
            echo '  name: "XRay",'
            echo "  url: \"$base/XRay.xcframework.zip\","
            echo "  checksum: \"${{ steps.apple.outputs.checksum }}\""
            echo ')'
            echo '```'
            echo
            echo "Update \`xrayCoreTag\` in vless_dart/android/build.gradle:"
            echo
            echo '```groovy'
            echo "ext.xrayCoreTag = '${{ steps.tag.outputs.tag }}'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
